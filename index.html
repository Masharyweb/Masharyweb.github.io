<style>
:root{--ink:#0D0D0D;--white:#FAFAFA;--accent:#1A6EFF;--accent2:#00C6A2;--muted:#6B7280;--border:#E5E7EB;--card:#F8F9FB;--mono:'Space Mono',monospace;--sans:'Cairo',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--white);color:var(--ink);line-height:1.7;overflow-x:hidden}
nav{position:sticky;top:0;width:100%;z-index:100;background:rgba(250,250,250,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 5%;display:flex;align-items:center;justify-content:space-between;height:68px}
.nav-brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--ink)}
.nav-photo{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid var(--accent)}
.nav-name{display:flex;flex-direction:column;line-height:1.2}.nav-name strong{font-size:.92rem;font-weight:700}.nav-name span{font-size:.68rem;color:var(--muted)}
.nav-links{display:flex;gap:1.5rem;list-style:none;align-items:center}
.nav-links a{font-size:.86rem;font-weight:600;color:var(--muted);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--accent)}
.nav-toggle{display:none;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--ink)}
section{padding:64px 5%;max-width:1080px;margin:0 auto}
.lbl{font-family:var(--mono);font-size:.7rem;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.5rem;text-align:center}
.ttl{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:900;margin-bottom:.5rem;letter-spacing:-.02em;text-align:center}
.sub{color:var(--muted);font-size:1rem;margin:0 auto 2.4rem;text-align:center;max-width:560px}
.div{width:78px;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin:0 auto 2.4rem;border-radius:2px}
.btn{background:var(--accent);color:#fff;padding:12px 28px;border-radius:6px;font-weight:700;font-size:.9rem;text-decoration:none;transition:all .2s;display:inline-block}
.btn:hover{background:#1558d6;transform:translateY(-2px)}
.btn-o{border:1.5px solid var(--ink);color:var(--ink);padding:12px 28px;border-radius:6px;font-weight:700;font-size:.9rem;text-decoration:none;transition:all .2s;display:inline-block}
.btn-o:hover{background:var(--ink);color:var(--white)}
footer{text-align:center;padding:2rem 5%;font-family:var(--mono);font-size:.74rem;color:var(--muted);background:var(--ink)}
.hero{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:70px 5% 50px;text-align:center}
.hero-in{max-width:740px}
.hp{width:148px;height:148px;border-radius:50%;object-fit:cover;object-position:center top;border:5px solid #fff;box-shadow:0 8px 32px rgba(26,110,255,.18);margin:0 auto 1.6rem;display:block}
.tag{display:inline-block;font-family:var(--mono);font-size:.7rem;color:var(--accent);background:rgba(26,110,255,.08);border:1px solid rgba(26,110,255,.2);padding:4px 14px;border-radius:20px;margin-bottom:1.1rem;letter-spacing:.1em}
.hero h1{font-size:clamp(2rem,5vw,2.9rem);font-weight:900;line-height:1.2;margin-bottom:.5rem}.hero h1 span{color:var(--accent)}
.hen{font-family:var(--mono);font-size:.92rem;color:var(--ink);margin-bottom:.5rem;letter-spacing:.01em}
.hsub{font-size:1.02rem;color:var(--muted);margin-bottom:1.4rem}
.hdesc{font-size:1rem;color:#374151;margin:0 auto 1.9rem;max-width:540px}
.ctas{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.stats{display:flex;justify-content:center;gap:2.6rem;margin-top:2.8rem;flex-wrap:wrap}
.st{text-align:center}.sn{font-family:var(--mono);font-size:1.7rem;font-weight:700;color:var(--accent);display:block}.sl{font-size:.76rem;color:var(--muted)}
.hsoc{display:flex;justify-content:center;gap:.9rem;margin-top:2rem;flex-wrap:wrap}
.hs{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);transition:all .25s;text-decoration:none}
.hs:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.1)}.hs svg{width:21px;height:21px}
.atext{max-width:700px;margin:0 auto}.atext p{color:#374151;margin-bottom:1rem;text-align:center}
.ahl{background:rgba(26,110,255,.05);border:1px solid rgba(26,110,255,.15);padding:1.1rem 1.4rem;border-radius:12px;margin:1.4rem auto;font-weight:600;font-size:.94rem;text-align:center;max-width:620px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.4rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;transition:all .2s}
.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 28px rgba(26,110,255,.08)}
a.card{text-decoration:none;color:inherit;display:block}
a.card h3{color:var(--ink)}
.ci{font-size:1.7rem;margin-bottom:.7rem}.card h3{font-size:1.02rem;font-weight:700;margin-bottom:.5rem}.card p{font-size:.86rem;color:var(--muted);line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}.tg{font-size:.68rem;font-family:var(--mono);background:var(--white);border:1px solid var(--border);padding:3px 9px;border-radius:4px;color:#374151}
.stt{font-size:.66rem;font-family:var(--mono);padding:3px 10px;border-radius:20px;float:left}
.s-live{background:rgba(0,198,162,.1);color:var(--accent2)}.s-dev{background:rgba(245,158,11,.1);color:#D97706}.s-fut{background:rgba(139,92,246,.1);color:#7C3AED}
.cs{background:var(--ink);padding:64px 5%}.cin{max-width:900px;margin:0 auto;text-align:center}
.cin .lbl{color:var(--accent2)}.cin .ttl{color:#fff}.cin .sub{color:#9CA3AF}
.socs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-top:2.4rem}
.sln{display:flex;flex-direction:column;align-items:center;gap:.6rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:1.6rem 1rem;text-decoration:none;color:#fff;transition:all .25s}
.sln:hover{background:rgba(255,255,255,.1);border-color:var(--accent);transform:translateY(-4px)}
.sic{width:36px;height:36px;display:flex;align-items:center;justify-content:center}.sic svg{width:36px;height:36px}
.snm{font-size:.88rem;font-weight:700}.shn{font-size:.76rem;color:#9CA3AF;font-family:var(--mono)}
@media(max-width:768px){
.nav-links{position:fixed;top:68px;left:0;background:var(--white);flex-direction:column;width:100%;padding:1.2rem 5%;gap:1rem;border-bottom:1px solid var(--border);transform:translateY(-150%);transition:transform .3s;box-shadow:0 8px 20px rgba(0,0,0,.06)}
.nav-links.open{transform:translateY(0)}.nav-toggle{display:block}.nav-name span{display:none}}
</style>
